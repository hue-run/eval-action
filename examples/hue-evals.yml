name: Hue
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: hue-evals-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  evals:
    name: Evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Run Hue evals
        id: hue
        if: ${{ always() && !cancelled() }}
        uses: hue-run/eval-action@v1
        env:
          HUE_API_KEY: ${{ secrets.HUE_API_KEY }}
          # Add the model credentials your agent already uses here.
        with:
          config: hue.eval.json
          report-dir: .hue/reports
